<title>ArmaLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: taller de librería — panel de herramientas | base de corte verde (vista 3D) | hoja de resultados */
:root{
  --bg:#edf0ea; --panel:#fbfcf9; --panel2:#f3f5f0; --fg:#1b231f; --muted:#5a6761; --line:#d4dbd3;
  --accent:#d0336b; --accent-ink:#ffffff; --accent-soft:#fadbe6; --kraft:#a8774a; --kraft-soft:#f1e4d3;
  --mat:#2a5848; --mat2:#234a3d;
  --ok:#2f7d52; --warn:#a2650f; --bad:#b4322f; --warn-soft:#fbefd9; --ok-soft:#e1f2e7; --bad-soft:#f9e0de; --chip:#e4eae3;
  --shadow:0 1px 2px rgba(20,40,30,.08), 0 4px 14px rgba(20,40,30,.06);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111513; --panel:#181e1b; --panel2:#1e2521; --fg:#e6ece8; --muted:#9ba7a0; --line:#2c3631;
  --accent:#f0689b; --accent-ink:#1a0710; --accent-soft:#4a1f31; --kraft:#cf9f6d; --kraft-soft:#3a2c1d;
  --mat:#1c3c32; --mat2:#16322a;
  --ok:#6cc391; --warn:#e4a64a; --bad:#f07a70; --warn-soft:#3a2c14; --ok-soft:#173226; --bad-soft:#3d1b19; --chip:#252e29;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111513; --panel:#181e1b; --panel2:#1e2521; --fg:#e6ece8; --muted:#9ba7a0; --line:#2c3631;
  --accent:#f0689b; --accent-ink:#1a0710; --accent-soft:#4a1f31; --kraft:#cf9f6d; --kraft-soft:#3a2c1d;
  --mat:#1c3c32; --mat2:#16322a;
  --ok:#6cc391; --warn:#e4a64a; --bad:#f07a70; --warn-soft:#3a2c14; --ok-soft:#173226; --bad-soft:#3d1b19; --chip:#252e29;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand .name{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1}
.brand .name i{font-style:normal;color:var(--accent)}
.brand .tag{font-size:11px;color:var(--muted);letter-spacing:.02em}
.ver{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);padding:2px 7px;border-radius:999px;background:var(--panel2);cursor:pointer;color:var(--fg)}
.ver b{color:var(--accent)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.stat{font-family:var(--f-mono);font-size:12px;background:var(--chip);border-radius:6px;padding:4px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{font-weight:600}
.stat.ok{background:var(--ok-soft)} .stat.warn{background:var(--warn-soft)} .stat.bad{background:var(--bad-soft)}
.app{display:grid;grid-template-columns:340px minmax(0,1fr) 430px;height:calc(100% - 55px)}
aside{background:var(--panel);overflow:auto;min-width:0}
aside#left{border-right:1px solid var(--line)}
aside#right{border-left:1px solid var(--line)}
.tabs{display:flex;position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:12px 4px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0;letter-spacing:-.015em;text-wrap:balance}
h3{font-size:11.5px;margin:0;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--kraft);transform:translateY(-1px)}
.card .ic{width:30px;height:30px;color:var(--fg)}
.card b{font-size:13.5px;line-height:1.2}
.card span{font-size:11.5px;color:var(--muted);line-height:1.3}
.card .sc{font-family:var(--f-mono);font-size:10.5px;color:var(--kraft);letter-spacing:.03em}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.form{display:flex;flex-direction:column;gap:10px}
.field{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center}
.field label{font-size:13px}
.field .hint{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-4px}
.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
.field input[type=file]{font-size:11.5px;padding:4px}
.field.wide{grid-template-columns:1fr}
.unit{display:flex;align-items:center;gap:4px}
.unit span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.xyz label{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.xyz input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-family:var(--f-mono);font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--kraft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25);display:inline-block;flex:none;vertical-align:-1px}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:300px;overflow-y:auto}
.plist button{display:flex;gap:8px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 10px;cursor:pointer;font-size:12.5px}
.plist button:last-child{border-bottom:0}
.plist button[aria-pressed="true"]{background:var(--accent-soft)}
.pid{font-family:var(--f-mono);font-weight:600;font-size:11.5px;background:var(--chip);border-radius:4px;padding:1px 5px;white-space:nowrap}
.editor{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel2)}
.editor .field input,.editor .field select{background:var(--panel)}
.note{border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45}
.note.warn{background:var(--warn-soft);border-left:3px solid var(--warn)}
.note.ok{background:var(--ok-soft);border-left:3px solid var(--ok)}
.note.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.note.info{background:var(--kraft-soft);border-left:3px solid var(--kraft)}
#viewWrap{position:relative;background:radial-gradient(120% 90% at 50% 30%, var(--mat) 0%, var(--mat2) 100%);min-width:0;min-height:0}
#c{width:100%;height:100%;display:block;touch-action:none}
.vtools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;right:10px;pointer-events:none}
.vtools button{pointer-events:auto;background:rgba(8,22,17,.6);color:#eef5f1;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px)}
.vtools button[aria-pressed="true"]{background:#eef5f1;color:#12261f}
.vhint{position:absolute;bottom:10px;left:10px;right:10px;color:#d6e7df;font-size:11.5px;font-family:var(--f-mono);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.tw{overflow-x:auto}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sum div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.sum b{display:block;font-family:var(--f-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sum span{font-size:11.5px;color:var(--muted)}
.sum .ok b{color:var(--ok)} .sum .warn b{color:var(--warn)} .sum .bad b{color:var(--bad)}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--fg);padding-top:8px;font-weight:700;gap:10px}
.tot b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.shop{font-size:11.5px;color:var(--kraft);font-weight:700}
ol.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:14px;width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--panel);display:grid;place-items:center}
ol.steps li.warn::before{background:var(--warn)}
ol.steps li b.t{display:block;margin-bottom:2px}
ol.steps li .d{font-size:13px}
.pages{display:flex;flex-direction:column;gap:14px}
.page{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);border-radius:2px;line-height:0}
.page svg{width:100%;height:auto;display:block}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
textarea{width:100%;min-height:90px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px;font-family:var(--f-mono);font-size:11px}
details{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel)}
details[open]{background:var(--panel2)}
details summary{cursor:pointer;font-weight:700;font-size:13.5px}
details .in{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-size:13px}
details .in ul{margin:0;padding-left:18px}
.catgrp{display:flex;flex-direction:column;gap:6px}
.matrow{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.matrow .n{font-weight:700;font-size:13px}
.matrow .u{font-size:11.5px;color:var(--muted)}
.matrow input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-family:var(--f-mono);font-size:12px;text-align:right}
.ok-t{color:var(--ok);font-weight:700} .warn-t{color:var(--warn);font-weight:700} .bad-t{color:var(--bad);font-weight:700}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:end}
.calc label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.calc input,.calc select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.calc output{grid-column:1/-1;font-weight:700;font-size:13px}
.ovl{position:fixed;inset:0;background:rgba(10,20,15,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:6px 8px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
#print{display:none}
@media (max-width:1240px){ .app{grid-template-columns:310px minmax(0,1fr) 370px} }
@media (max-width:1000px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto}
  #viewWrap{height:58vh;order:-1}
  aside#left,aside#right{border:0;border-top:1px solid var(--line);overflow:visible}
  .tabs{position:static}
  .stats{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print .pp{width:210mm;height:297mm;page-break-after:always;break-after:page;overflow:hidden}
  #print .pp svg{width:210mm;height:297mm;display:block}
}
</style>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="10" fill="var(--mat)"/><path d="M9 31 L20 8 L31 31 Z" fill="#f2a6c0"/><path d="M20 8 L31 31 L20 24 Z" fill="var(--accent)"/><path d="M14.5 24 L25.5 24" stroke="#fbfcf9" stroke-width="1.6" stroke-dasharray="2 1.6"/><circle cx="20" cy="8" r="2" fill="#fbfcf9"/></svg>
    <div><div class="name">Arma<i>Lab</i></div><div class="tag">Modelá · cortá · armá</div></div>
  </div>
  <button class="ver" id="verBtn" title="Novedades">v<b id="verTxt"></b> · novedades</button>
  <div class="stats" id="stats"></div>
</header>

<main class="app">
  <aside id="left" aria-label="Herramientas">
    <div class="tabs" role="tablist" data-group="L">
      <button role="tab" data-tab="proyecto" aria-selected="true">Proyecto</button>
      <button role="tab" data-tab="modelar" aria-selected="false">Modelar</button>
      <button role="tab" data-tab="tecnicas" aria-selected="false">Técnicas</button>
      <button role="tab" data-tab="materiales" aria-selected="false">Precios</button>
    </div>
    <div id="L-proyecto" class="pane"></div>
    <div id="L-modelar" class="pane" hidden></div>
    <div id="L-tecnicas" class="pane" hidden></div>
    <div id="L-materiales" class="pane" hidden></div>
  </aside>

  <section id="viewWrap" aria-label="Vista 3D">
    <canvas id="c"></canvas>
    <div class="vtools">
      <button id="tMove" aria-pressed="true">Mover</button>
      <button id="tRot" aria-pressed="false">Rotar</button>
      <button id="tFit">Encuadrar</button>
      <button id="tFront">Frente</button>
      <button id="tTop">Arriba</button>
      <button id="tRuler" aria-pressed="true">Medidas</button>
      <button id="tHuman" aria-pressed="false">Persona 1,70 m</button>
    </div>
    <div class="vhint" id="vhint">Arrastrá para girar · rueda para zoom · clic en una pieza para editarla</div>
  </section>

  <aside id="right" aria-label="Resultados">
    <div class="tabs" role="tablist" data-group="R">
      <button role="tab" data-tab="piezas" aria-selected="true">Piezas</button>
      <button role="tab" data-tab="compras" aria-selected="false">Compras</button>
      <button role="tab" data-tab="pasos" aria-selected="false">Paso a paso</button>
      <button role="tab" data-tab="plantillas" aria-selected="false">Plantillas</button>
    </div>
    <div id="R-piezas" class="pane"></div>
    <div id="R-compras" class="pane" hidden></div>
    <div id="R-pasos" class="pane" hidden></div>
    <div id="R-plantillas" class="pane" hidden></div>
  </aside>
</main>
<div id="modal" class="ovl" hidden></div>
<div id="print"></div>

<script>
'use strict';
/* =========================================================
   ArmaLab — modelador de manualidades con materiales de librería
   Unidades internas: centímetros. Espesores del catálogo en mm.
   ========================================================= */
const VERSION = '0.2.0';
const FONT_JSON = /*FONT_JSON*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1 = n => Math.round(n*10)/10;
const nf = n => (Math.round(n*10)/10).toLocaleString('es-AR');
const nf2 = n => (Math.round(n*100)/100).toLocaleString('es-AR');
const fmtL = cm => Math.abs(cm) >= 100 ? `${nf2(cm/100)} m` : `${nf(cm)} cm`;
const fmtW = g => g >= 1000 ? `${nf(g/1000)} kg` : `${Math.round(g)} g`;
const money = n => '$' + Math.round(n).toLocaleString('es-AR');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let EN_FRAME = false; try{ EN_FRAME = window.self !== window.top; }catch(e){ EN_FRAME = true; }

/* ---------- Colores con nombre ---------- */
const COLORES = {
  'rosa claro':'#f5b8cb','rosa fuerte':'#e0517e','fucsia':'#c8246a','blanco':'#f3f1ec','marrón':'#6e4b34','kraft':'#b48a5c','verde':'#4c8a4a',
  'verde claro':'#9ccc7c','rojo':'#c8343a','amarillo':'#f1c63e','naranja':'#ea8a2f','celeste':'#86c2e5',
  'azul':'#2f5ea6','lila':'#b9a2dd','violeta':'#8a5bb4','negro':'#2b2b2b','gris':'#9b9b9b','dorado':'#cfa64a','plateado':'#c8cdd2'
};

/* =========================================================
   Catálogo. Cada material tiene "ofertas": dónde comprar, presentación (q = unidades base) y precio.
   Precios relevados en Argentina, fines de octubre 2026 (ver README). tr = % descuento por transferencia.
   ========================================================= */
const O = (t, q, pr, tr, nota) => ({t, q, pr, tr:tr||0, nota});
const MATS = [
  {id:'cg1c', cat:'Cartones y placas', nombre:'Cartón gris N°25 · 1 mm', tipo:'hoja', w:35, h:50, esp:1, g:610, color:'#8e8a83', grupo:'carton', corte:'cutter', uso:'Piezas chicas, tapas y tiras laterales que se curvan.', of:[O('Librería de barrio',1,750,0,'sin relevar en 2026')]},
  {id:'cg15', cat:'Cartones y placas', nombre:'Cartón gris N°16 · 1,5 mm', tipo:'hoja', w:70, h:100, esp:1.5, g:915, color:'#8a867f', grupo:'carton', corte:'cutter', uso:'Estructuras medianas (hasta ~12 cm de alto).', of:[O('Librería de barrio',1,4100,0,'sin relevar en 2026')]},

  if (precios[id] != null && !isNaN(precios[id])) return +precios[id];
  const m = MAT[id]; if (m){ const o = m.of.find(o=>o.q===1) || m.of[0]; return o.pr/o.q; }
  return INS[id].precio;
}
function ofertas(id){

}

function arbolCalc(p){
  const H = p.H; const largo = Math.ceil(H*2.6/5)*5; const rCopa = 0.4*H;
  const flores = Math.round(2*Math.PI*rCopa*rCopa/0.8*(p.dens==null?1:p.dens));
  return {largo, flores, tiras:Math.ceil(H*1.35), copa:r1(rCopa*2), tronco:r1(0.4*H)};
}
const FLORG = {
  seda:{n:'Pompón de papel seda (Ø 10 cm)', mat:'seda', r:5, area:4*15*15, cob:78},
  crepe:{n:'Rosetón de crepé (Ø 6 cm)', mat:'crepe', r:3, area:5*30, cob:28},
};
function arbolGCalc(p){
  const Hm = p.H/100, copa = p.H*p.copa/100, r = copa/2;
  const F = FLORG[p.flor];
  const flores = Math.round(2*Math.PI*r*r*0.6*p.dens / F.cob);
  const alambreM = Math.ceil(7*Hm*Hm*10)/10 + 2;                      // m de galvanizado N°16
  const dT = Math.max(4, p.H/12);                                      // diámetro del tronco con volumen
  const tronco = 0.45*p.H;
  const areaTr = Math.PI*dT*tronco + 6*Math.PI*(dT/2.5)*(0.4*p.H);     // tronco + 6 ramas principales (cm²)
  const kraft = areaTr*TEX[p.tex||'retorcido'].f;
  const almaLen = tronco + 25;
  const B = BASESG[p.base];
  return {flores, alambreM, dT:r1(dT), tronco:r1(tronco), kraft, almaLen:Math.ceil(almaLen/5)*5, copa:r1(copa), B};
}

  const key = JSON.stringify([p.H,p.hebras,p.seed,opt.n,opt.copa,opt.spread]);
  if (arbolCache.has(key)) return arbolCache.get(key);
  const rnd = rng(p.seed||1), V = THREE.Vector3;
  const segs = [], tips = [];
  function grow(a, dir, len, n, depth){
    const b = a.clone().addScaledVector(dir, len);
    segs.push({a, b, n, depth});
    if (n <= 2 || depth >= 5){ tips.push(b); return; }
    const k = (n >= 9 && depth < 2) ? 3 : 2;
    const parts = []; let rem = n;
    for (let i=0;i<k;i++){ const q = i===k-1 ? rem : Math.max(1, Math.min(rem-(k-1-i), Math.round(n/k + (rnd()-0.5)*n*0.15))); parts.push(q); rem -= q; }
    const base = rnd()*Math.PI*2;
    parts.forEach((q,i)=>{
      if (q<=0) return;
      const az = base + i*2*Math.PI/k + (rnd()-0.5)*0.6;
      const tilt = (depth===0 ? 0.62 : 0.5) + (rnd()-0.5)*0.3;
      const side = new V(Math.cos(az), 0, Math.sin(az));
      const nd = dir.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(side, Math.sin(tilt)).normalize();
      nd.y = Math.max(nd.y, 0.18); nd.normalize();
      grow(b, nd, len*(0.66+rnd()*0.16), q, depth+1);
    });
  }
  grow(new V(0,0,0), new V(0,1,0), 0.4, p.hebras, 0);
  const roots = [];
  if (!opt.sinRaiz) for (let i=0;i<5;i++){ const az = i/5*Math.PI*2 + rnd()*0.4; roots.push({a:new V(0,0.04,0), b:new V(Math.cos(az)*0.11, 0.004, Math.sin(az)*0.11), n:2, depth:9}); }
  let maxY = 0, maxR = 0; tips.forEach(t => { maxY = Math.max(maxY, t.y); maxR = Math.max(maxR, Math.hypot(t.x, t.z)); });
  const s = (p.H*(opt.copa?1:0.99))/maxY;
  const sx = opt.copa ? (opt.copa/2*0.9)/(maxR*s) : 1;
  const S = v => new V(v.x*s*sx, v.y*s, v.z*s*sx);
  const out = {segs: segs.concat(roots).map(g=>({a:S(g.a), b:S(g.b), n:g.n, depth:g.depth})), tips: tips.map(S), flores:[]};
  const nF = opt.n != null ? opt.n : arbolCalc(p).flores;
  const cands = [];
  out.segs.forEach(g=>{ if (g.depth>=2 && g.depth<9){ for (let t=0.35;t<=1.001;t+=0.325) cands.push(g.a.clone().lerp(g.b,t)); } });
  out.tips.forEach(t=>{ cands.push(t,t,t); });
  const cx = new V(); cands.forEach(v=>cx.add(v)); cx.divideScalar(Math.max(1,cands.length));
  const spread = (opt.spread || 0.11)*p.H;
  for (let i=0;i<nF;i++){
    const base = cands[Math.floor(rnd()*cands.length)] || new V(0,p.H*0.7,0);
    const off = new V(rnd()-0.5, rnd()-0.4, rnd()-0.5).normalize().multiplyScalar(spread*Math.cbrt(rnd()));
    const pos = base.clone().add(off);
    out.flores.push({pos, c2: pos.distanceTo(cx) < spread*1.6 ? rnd()<0.7 : rnd()<0.3});
  }
  arbolCache.set(key, out);
  return out;
}

function perfilCopa(Ht, W, forma, tw){
  const a = W/2, th = 0.33*Ht, b = (Ht - th)/2*1.08, cy = Ht - b;
  const lob = forma==='nube' ? 0.075 : 0;
  const m = t => 1 + lob*Math.cos(7*(t - Math.PI/2));
  const X = t => a*m(t)*Math.cos(t), Y = t => cy + b*m(t)*Math.sin(t);
  let t0 = -Math.PI/2; while (X(t0) < tw/2 && t0 < 0) t0 += 0.002;
  const tEnd = Math.PI*1.5 - (t0 + Math.PI/2);
  const pts = []; const N = 140;
  for (let i=0;i<=N;i++){ const t = t0 + (tEnd - t0)*i/N; pts.push([X(t), Y(t)]); }
  pts.push([-tw/2, 0], [tw/2, 0]);
  let maxY = -1e9; pts.forEach(p=>maxY=Math.max(maxY,p[1]));
  const k = Ht/maxY; pts.forEach(p=>p[1]*=k);
  return {pts, cy:cy*k, a, perimetro: Math.PI*(3*(a+b)-Math.sqrt((3*a+b)*(a+3*b)))*0.85};
}
function ranuraArriba(pts, s, yEnd){
  const out = []; let done = false;
  for (let i=0;i<pts.length;i++){
    const p = pts[i], q = pts[(i+1)%pts.length];
    out.push(p);
    if (!done && p[1] > yEnd && p[0] >= s/2 && q[0] < s/2){
      const yR = p[1] + (q[1]-p[1])*((s/2 - p[0])/(q[0]-p[0]));
      let j = i+1; while (j < pts.length-1 && !(pts[j][0] > -s/2 && pts[j+1][0] <= -s/2)) j++;
      const a = pts[j], c = pts[j+1];
      const yL = a[1] + (c[1]-a[1])*((-s/2 - a[0])/(c[0]-a[0]));
      out.push([s/2, yR], [s/2, yEnd], [-s/2, yEnd], [-s/2, yL]);
      i = j; done = true;
    }
  }
  return out;
}
function ranuraAbajo(pts, s, yEnd, tw){ const out = pts.slice(0, -2); out.push([-tw/2,0], [-s/2,0], [-s/2,yEnd], [s/2,yEnd], [s/2,0], [tw/2,0]); return out; }
function cruz(l, s){ const h = l/2, w = s/2; return [[-h,-w],[-w,-w],[-w,-h],[w,-h],[w,-w],[h,-w],[h,w],[w,w],[w,h],[-w,h],[-w,w],[-h,w]]; }
// silueta genérica de persona (alto 1, pies en y=0)
function siluetaPersona(H){
  const R = [[0.0,0.46],[0.02,0.03],[0.02,0],[0.11,0],[0.105,0.03],[0.098,0.25],[0.112,0.47],[0.142,0.44],[0.162,0.47],[0.168,0.63],[0.15,0.79],[0.07,0.835],[0.04,0.852]];
  const head = []; for (let a=-60;a<=90;a+=10){ const t = a*Math.PI/180; head.push([0.068*Math.cos(t), 0.925+0.07*Math.sin(t)]); }
  const right = R.concat(head);
  const left = right.slice(1, -1).reverse().map(([x,y])=>[-x,y]);
  return right.concat(left).map(([x,y])=>[x*H, y*H]);
}
function rectRedondeado(W, H, r){ const pts = []; const c = [[W/2-r,H-r,0],[-W/2+r,H-r,90],[-W/2+r,r,180],[W/2-r,r,270]]; c.forEach(([cx,cy,a0])=>{ for (let a=0;a<=90;a+=15){ const t=(a0+a)*Math.PI/180; pts.push([cx+r*Math.cos(t), cy+r*Math.sin(t)]); } }); return pts; }
function ovalo(W, H){ const pts=[]; for (let i=0;i<48;i++){ const t=i/48*Math.PI*2; pts.push([W/2*Math.cos(t), H/2+H/2*Math.sin(t)]); } return pts; }
function petalo(L, w){ const pts = []; const N = 14;
  for (let i=0;i<=N;i++){ const s = i/N; pts.push([ (w/2)*(0.16 + 0.84*Math.pow(Math.sin(Math.PI*Math.min(1,s*0.92+0.04)),0.85)) * (s>0.85? Math.cos((s-0.85)/0.15*Math.PI/2)*0.98+0.02 : 1), s*L ]); }
  return pts.concat(pts.slice(0,-1).reverse().map(([x,y])=>[-x,y]));
}
function polyPerim(pts){ let s=0; for (let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; s+=Math.hypot(b[0]-a[0], b[1]-a[1]); } return s; }
function polyArea(pts){ let s=0; for (let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; s+=a[0]*b[1]-b[0]*a[1]; } return Math.abs(s/2); }

function troquelCaja(W, D, H){
  const t = Math.min(1.5, H*0.45), e = Math.min(0.3, H*0.1);
  const pts = [[-W/2,D/2+H],[W/2,D/2+H],[W/2,D/2],[W/2+e,D/2+t],[W/2+H-e,D/2+t],[W/2+H,D/2],[W/2+H,-D/2],[W/2+H-e,-D/2-t],[W/2+e,-D/2-t],[W/2,-D/2],
    [W/2,-D/2-H],[-W/2,-D/2-H],[-W/2,-D/2],[-W/2-e,-D/2-t],[-W/2-H+e,-D/2-t],[-W/2-H,-D/2],[-W/2-H,D/2],[-W/2-H+e,D/2+t],[-W/2-e,D/2+t],[-W/2,D/2]];
  const folds = [[[-W/2,D/2],[W/2,D/2]],[[-W/2,-D/2],[W/2,-D/2]],[[W/2,-D/2],[W/2,D/2]],[[-W/2,-D/2],[-W/2,D/2]],
    [[W/2,D/2],[W/2+H,D/2]],[[W/2,-D/2],[W/2+H,-D/2]],[[-W/2,D/2],[-W/2-H,D/2]],[[-W/2,-D/2],[-W/2-H,-D/2]]];

      pcs.push(l1, l2);

/* =========================================================
   Cálculos de piezas compuestas
   ========================================================= */
function macheCalc(p){
  const a = p.d/2, c = p.alto/2; const pp = 1.6075;
  const area = 4*Math.PI*Math.pow((Math.pow(a*a,pp)+2*Math.pow(a*c,pp))/3, 1/pp);   // superficie del elipsoide (cm²)
  const m2 = area/1e4;
  const pasta = m2*p.capas*350;                                    // g de pasta (estimado)
  const tandas = Math.ceil(p.capas/2.5);
  const horas = Math.round(tandas*24*(p.hum||1) + (p.d>60?24:0));
  return {area, tiras:Math.ceil(area*p.capas*1.15/45), papel:area*p.capas*1.15, harina:Math.round(pasta/3/10)*10, colaG:Math.round(pasta/2/10)*10, tandas, horas, flecos:p.term==='flecos'?area*1.6:0};
}
function tramos(w, h, m){
  if (!m.w || ((w <= m.w-1 && h <= m.h-1) || (w <= m.h-1 && h <= m.w-1))) return [{w, h}];
  const A = m.w-1, B = m.h-1, sol = 2;
  const opt = (a, b) => { const kw = w > a ? Math.ceil((w-sol)/(a-sol)) : 1, kh = h > b ? Math.ceil((h-sol)/(b-sol)) : 1; return {kw, kh, n:kw*kh}; };
  const o1 = opt(A,B), o2 = opt(B,A); const o = o1.n <= o2.n ? o1 : o2;
  const pw = (w + sol*(o.kw-1))/o.kw, ph = (h + sol*(o.kh-1))/o.kh; const out = [];
  for (let i=0;i<o.n;i++) out.push({w:pw, h:ph}); return out;
}
function partesHoja(w, h, m){
  if (!m.w) return {n:1};
  const a = Math.ceil(w/m.w)*Math.ceil(h/m.h), b = Math.ceil(w/m.h)*Math.ceil(h/m.w);
  return {n:Math.min(a,b)};
}

function pieceLabel(pc){ return pc.p.nombre || (pc.kind==='disco' && pc.rol==='pasto' ? 'Pasto (disco)' : KINDS[pc.kind].nom); }
function cutsOf(pc){
  const m = MAT[pc.mat]; const col = m && m.colorable ? pc.color : null; const C = [];
  if (pc.p.noCut) return C;
  const base = {pid:pc.id, mat:pc.mat, color:col, nombre:pieceLabel(pc), qty:pc.p.qty||1};
  const tf = (TEX[pc.p.tex]||TEX.liso).f;
  switch (pc.kind){
    case 'placa': C.push({...base, shape:'rect', w:pc.p.w*Math.sqrt(tf), h:pc.p.h*Math.sqrt(tf), medida:`${fmtL(pc.p.w)} × ${fmtL(pc.p.h)}${tf>1?` (cortá ${nf(pc.p.w*Math.sqrt(tf))} × ${nf(pc.p.h*Math.sqrt(tf))} cm: se achica al arrugar)`:''}`, curva:pc.p.curva}); break;
    case 'disco': { const d = pc.p.d + 2*(pc.p.doblez||0); const holes = pc.p.cruz ? [cruz(pc.p.cruz.l, pc.p.cruz.s)] : [];
      C.push({...base, shape:'circle', d, w:d, h:d, holes, medida:`Ø ${fmtL(d)}${pc.p.cruz?` · cruz ${nf(pc.p.cruz.l)} cm × ${nf(pc.p.cruz.s*10)} mm`:''}`}); break; }
    case 'perfil': { let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; pc.p.pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
      const hl = (pc.p.holes||[]).filter(()=>!pc.p.ext).map(h=>{ const xs=h.map(q=>q[0]), ys=h.map(q=>q[1]); return ` · calado ${nf(Math.max(...xs)-Math.min(...xs))} × ${nf(Math.max(...ys)-Math.min(...ys))} cm a ${nf(Math.min(...ys))} cm del piso`; }).join('');
      C.push({...base, shape:'poly', pts:pc.p.pts, holes:pc.p.holes||[], folds:pc.p.folds, veta:pc.p.veta, w:x1-x0, h:y1-y0, x0, y0, medida:`${fmtL(x1-x0)} × ${fmtL(y1-y0)}${pc.p.ranura?` · ranura ${nf(pc.p.ranura*10)} mm`:''}${hl}`}); break; }
    case 'tubo': { const L = r1((Math.PI*pc.p.d*pc.p.v + 1)*Math.sqrt(tf)); C.push({...base, shape:'rect', w:L, h:pc.p.h, medida:`${fmtL(L)} × ${fmtL(pc.p.h)} (se enrolla en Ø ${nf(pc.p.d)} cm)`}); break; }
    case 'cono': { const L = Math.hypot(pc.p.r, pc.p.h); const ang = 2*Math.PI*pc.p.r/L + 1/L; const pts = [[0,0]];
      for (let i=0;i<=40;i++){ const t = -ang/2 + ang*i/40; pts.push([L*Math.sin(t), L*Math.cos(t)]); }
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; pts.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
      C.push({...base, shape:'poly', pts, w:x1-x0, h:y1-y0, x0, y0, medida:`sector de radio ${fmtL(L)}, ${Math.round(ang*180/Math.PI)}° (incluye solapa de 1 cm)`}); break; }
    case 'esfera': { const c = macheCalc(pc.p);
      C.push({...base, mano:true, qty:c.tiras, area:c.papel, medida:'tiras rasgadas de 3 × 15 cm', nombre:`Tiras de ${MAT[pc.mat].nombre.split(' (')[0].toLowerCase()}`});
      if (c.flecos) C.push({pid:pc.id, mat:'crepe', color:pc.p.tcolor, nombre:'Flecos', mano:true, qty:Math.ceil(c.flecos/(6*50)), area:c.flecos, medida:'tiras de 6 × 50 cm con flecos de 4 cm'});

    case 'racimo': C.push({...base, mano:true, qty:pc.p.n, area:pc.p.n*pc.p.b*pc.p.b, medida:`cuadraditos de ${nf(pc.p.b)} × ${nf(pc.p.b)} cm`, nombre:'Bolitas de papel'}); break;

/* ---------- Peso, centro de masa y vuelco ---------- */
function pesoPieza(pc){

    if (c.ins) return; const m = MAT[c.mat];

  if (pc.p.lastre) g += pc.p.lastre*1000;
  if (pc.kind==='esfera'){ const c = macheCalc(pc.p); g += (pc.p.pasta==='engrudo'?c.harina:c.colaG)*0.6; }
  return g;
}
const pesoTotal = () => state.project.pieces.reduce((a,pc)=>a+pesoPieza(pc),0);
function masasPieza(pc, obj){
  const g = pesoPieza(pc); if (!obj) return [];

    return [{m:F, p:new THREE.Vector3(0, c.B.h*0.4, 0)}, {m:resto*0.45, p:new THREE.Vector3(0, pc.p.H*0.75, 0)}, {m:resto*0.55, p:new THREE.Vector3(0, pc.p.H*0.35, 0)}]; }
  if (pc.p.lastre){ const bb = new THREE.Box3().setFromObject(obj); const c = bb.getCenter(new THREE.Vector3()); return [{m:g - pc.p.lastre*1000, p:c}, {m:pc.p.lastre*1000, p:new THREE.Vector3(c.x, 1.5, c.z - (bb.max.z-bb.min.z)*0.15)}]; }
  const bb = new THREE.Box3().setFromObject(obj); return [{m:g, p:bb.getCenter(new THREE.Vector3())}];

function vuelco(){
  const pcs = state.project.pieces; if (!pcs.length || !objs.size) return {th:null};
  const tp = state.project.template; if (tp && !state.project.modificado && TEMPLATES[tp.id].sinVuelco) return {th:null};
  let M = 0; const cm = new THREE.Vector3(); let H = 0;
  pcs.forEach(pc=>{ const o = objs.get(pc.id); if (!o) return; masasPieza(pc, o).forEach(({m,p})=>{ M += m; cm.addScaledVector(p, m); }); H = Math.max(H, new THREE.Box3().setFromObject(o).max.y); });
  if (!M || H < 25) return {th:null, H};
  cm.divideScalar(M);
  // huella: vértices a menos de 0,8 cm del piso
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9; const v = new THREE.Vector3();
  root.updateMatrixWorld(true);
  root.traverse(o=>{ if (!o.isMesh || o.isInstancedMesh) return; const pa = o.geometry.attributes.position; const step = Math.max(1, Math.floor(pa.count/4000));
    for (let i=0;i<pa.count;i+=step){ v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld); if (v.y < 0.8){ x0=Math.min(x0,v.x); x1=Math.max(x1,v.x); z0=Math.min(z0,v.z); z1=Math.max(z1,v.z); } } });
  if (x0 > x1) return {th:null, H};
  const d = Math.min(cm.x-x0, x1-cm.x, cm.z-z0, z1-cm.z);

}

/* ---------- Acomodo por estantes ---------- */
function shelfPack(items, W, H, gap){
  const pages = [], overs = [], its = [];
  for (const it of items){
    let w = it.w, h = it.h, rot = false;
    if (w < h && h <= W && !(it.keep && h <= H)){ [w,h] = [h,w]; rot = true; }
    if (w > W || h > H){ if (h <= W && w <= H){ [w,h]=[h,w]; rot=!rot; } else { overs.push(it); continue; } }
    its.push({it, w, h, rot});
  }
  its.sort((a,b)=>b.h-a.h);
  const place = (pg, r) => {
    for (const s of pg.shelves){ if (r.h <= s.h && s.x + r.w <= W){ pg.placed.push({...r, x:s.x, y:s.y}); s.x += r.w + gap; return true; } }
    if (pg.y + r.h <= H){ const s = {y:pg.y, h:r.h, x:r.w + gap}; pg.shelves.push(s); pg.y += r.h + gap; pg.placed.push({...r, x:0, y:s.y}); return true; }
    return false;
  };
  for (const r of its){ if (!pages.some(pg=>place(pg,r))){ const pg = {shelves:[], placed:[], y:0}; pages.push(pg); place(pg,r); } }
  return {pages, overs};
}

function computeBOM(N, transfer){

function aguanta(pc, obj){
  const m = MAT[pc.mat];
  if (pc.p.noCut) return {ok:true, msg:'Vista'};
  if (pc.kind==='arbol'){
    if (pc.mat==='al26') return {ok:false, msg:'El N°26 es muy blando para un tronco: usá N°22 o N°18.'};
    if (pc.p.H > 20 && pc.mat!=='al18') return {ok:false, msg:'Para más de 20 cm conviene alambre N°18.'};
    if (pc.p.H > 20 && pc.p.hebras < 16) return {ok:false, msg:'Para esta altura usá 16 hebras o más.'};
    return {ok:true, msg:'Estructura OK'};
  }
  if (pc.kind==='arbolG'){ const v = vuelco(); if (v.sem==='bad') return {ok:false, msg:'Se puede volcar: usá una base más pesada o más ancha.'}; return {ok:true, msg:'Alma + base con lastre'}; }
  if (pc.kind==='racimo') return {ok:true, msg:'Decorativo'};
  if (pc.kind==='esfera') return pc.p.capas < 3 && pc.p.term!=='flecos' ? {ok:false, msg:'Con menos de 3 capas queda frágil.'} : {ok:true, msg:`${pc.p.capas} capas`};
  if (pc.kind==='varilla'){
    if (pc.mat==='al26' && pc.p.len > 8) return {ok:false, msg:'Alambre fino y largo: se dobla. Usá N°18 o un palito.'};
    if (m.tipo==='unidad' && pc.p.len > m.len) return {ok:false, msg:`Mide más que una unidad (${fmtL(m.len)}): vas a unir dos.`};
    return {ok:true, msg:'OK'};
  }
  if (pc.kind==='disco' && pc.rol==='pasto') return {ok:true, msg:'Forrado'};
  if (pc.p.hide3d && pc.p.curva) return {ok:true, msg:'Tira lateral'};
  let alto = 0;
  if (obj){ const bb = new THREE.Box3().setFromObject(obj); alto = bb.max.y - bb.min.y; }
  if (pc.p.ext) alto = Math.min(alto, pc.p.ext*6);
  if (pc.p.hide3d) alto = 0;
  if (m.esp < 0.5){ if (alto > 1) return {ok:false, msg:'Es papel: no es estructural. Pegalo sobre cartón o usá cartón gris.'}; return {ok:true, msg:'Forrado / papel'}; }
  if (alto > 200 && m.grupo!=='plastico') return {ok:false, msg:`${fmtL(alto)} es mucho para una placa sola: necesita estructura interna o costillas atrás.`};
  if (alto > 100 && m.esp < 5) return {ok:false, msg:`Para ${fmtL(alto)} usá foamboard 5 mm con nervios o corrugado doble.`};
  if (alto > 50 && m.esp < 3) return {ok:false, msg:`Para ${fmtL(alto)}: pegá un nervio en “L” atrás o pasá a corrugado/foam.`};
  if (alto/m.esp > 8 && alto <= 50){ const rec = Math.ceil(alto/8*2)/2; return {ok:false, msg:`Muy alta (${fmtL(alto)}) para ${nf(m.esp)} mm: puede doblarse. Recomendado ≥ ${nf(rec)} mm.`}; }
  return {ok:true, msg:'Estructura OK'};
}

function tiempoMin(){

    if (pc.p.noCut) return; const m = MAT[pc.mat]; const f = m.corte==='cutter' ? (1 + m.esp/3) : 1; const q = pc.p.qty||1;
    const big = c => c.shape ? Math.max(1, (c.w*c.h)/600) : 1;
    if (pc.kind==='placa') t += 3*f*Math.sqrt(big(cutsOf(pc)[0]||{})); else if (pc.kind==='disco') t += 5*f; else if (pc.kind==='perfil') t += (pc.p.qty>2?4:12)*f*q*Math.sqrt(big(cutsOf(pc)[0])) + (pc.p.ranura?6:0);
    else if (pc.kind==='tubo' || pc.kind==='cono') t += 6; else if (pc.kind==='varilla') t += 2; else if (pc.kind==='racimo') t += pc.p.n*0.3;
    else if (pc.kind==='arbol') t += 70 + arbolCalc(pc.p).flores*0.3;
    else if (pc.kind==='arbolG') t += 240 + arbolGCalc(pc.p).flores*(pc.p.flor==='seda'?3:1.5);

  });
  return Math.round(t/5)*5;
}

function calcTec(){
  const v = id => parseFloat(($('#'+id)||{}).value);
  const o = (id, t) => { const e = $('#'+id); if (e) e.innerHTML = t; };
  if (!$('#k-out')) return;
  const f = TEX[$('#k-tex').value].f; o('k-out', `Papel a comprar: ${nf(v('k-area')*f)} cm² (${nf(f)}×)`);
  const L = v('k-cl'), e = v('k-ce'); o('k-cout', `Hasta ${nf(L*(1+e))} cm estirado al máximo · para copa: ${nf(L*(1+e/3))}–${nf(L*(1+e/2))} cm`);
  const r = rigidezRel(v('k-eb'), v('k-ea')); o('k-rout', isFinite(r) ? `B es ${nf(r)} veces más rígido que A` : '');
  const th = Math.atan2(v('k-vb')/2, v('k-vh'))*180/Math.PI; const s = vueltoSemaforo(th); o('k-vout', `<span class="${s}-t">${s==='ok'?'●':s==='warn'?'●':'●'} θ = ${nf(th)}° · ${s==='ok'?'estable':s==='warn'?'cuidado con empujones':'se cae fácil: lastre o base más ancha'}</span>`);
  const c = v('k-mc'), h = v('k-mh'); o('k-mout', `${Math.ceil(c/2.5)} tanda(s) · ~${Math.round(Math.ceil(c/2.5)*24*h)} h de secado`);
}

/* ---------- Plantillas: hojas A4 1:1, con mosaico para piezas grandes ---------- */
const UW = 19, UH = 25.8;
function buildPages(){
  const cuts = allCuts().filter(c=>c.shape); const byMat = {};
  cuts.forEach(c=>{ const k = c.mat + '|' + (c.color||''); (byMat[k] = byMat[k] || []).push(c); });
  const pages = [], overs = [], tiles = [];
  Object.entries(byMat).forEach(([k, cs])=>{
    const items = []; cs.forEach(c=>{ const q = c.qty > 1 && c.shape==='poly' ? 1 : c.qty; for (let i=0;i<q;i++) items.push({w:c.w+0.2, h:c.h+0.2, c, keep:c.shape==='poly'}); });
    const pk = shelfPack(items, UW, UH, 0.4);
    pk.overs.forEach(o=>{ if (!overs.includes(o.c)) overs.push(o.c); });
    pk.pages.forEach(pg=>pages.push({mat:cs[0].mat, color:cs[0].color, placed:pg.placed}));
  });
  overs.filter(c=>c.shape!=='rect').forEach(c=>{ const ov = 1; const cols = Math.ceil((c.w - ov)/(UW - ov)), rows = Math.ceil((c.h - ov)/(UH - ov));
    for (let r=0;r<rows;r++) for (let q=0;q<cols;q++) tiles.push({c, r, q, rows, cols}); });
  return {pages, overs, tiles};
}
function shapePath(c, map){

  const P = pts => 'M' + pts.map(p=>map(p).map(v=>v.toFixed(2)).join(' ')).join(' L') + ' Z';
  let s = '';
  if (c.shape==='circle'){ const [cx,cy] = map([0,0]); s += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${(c.d*5).toFixed(2)}" fill="none" stroke="#000" stroke-width="0.35"/>`; (c.holes||[]).forEach(h=>{ s += `<path d="${P(h)}" fill="#e9e9e9" stroke="#000" stroke-width="0.3"/>`; }); }
  else { s += `<path d="${P(pts)}" fill="none" stroke="#000" stroke-width="0.35" stroke-linejoin="round"/>`; (c.holes||[]).forEach(h=>{ s += `<path d="${P(h)}" fill="#e9e9e9" stroke="#000" stroke-width="0.3"/>`; }); }
  (c.folds||[]).forEach(([a,b])=>{ const A = map(a), B = map(b); s += `<line x1="${A[0].toFixed(2)}" y1="${A[1].toFixed(2)}" x2="${B[0].toFixed(2)}" y2="${B[1].toFixed(2)}" stroke="#2f5ea6" stroke-width="0.3" stroke-dasharray="2 1.2"/>`; });
  if (c.veta || c.curva){ const cy0 = c.y0!=null ? c.y0 + c.h*0.2 : -c.h*0.3, cy1 = c.y0!=null ? c.y0 + c.h*0.6 : c.h*0.1; const x = c.x0!=null ? c.x0 + c.w*0.5 : 0; const A = map([x, cy0]), B = map([x, cy1]);
    s += `<line x1="${A[0].toFixed(2)}" y1="${A[1].toFixed(2)}" x2="${B[0].toFixed(2)}" y2="${B[1].toFixed(2)}" stroke="#a8774a" stroke-width="0.5" marker-end="url(#ar)" marker-start="url(#ar)"/>`; }
  return s;
}
const SVG_HEAD = (titulo, sub) => {
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 6 3 0 6z" fill="#a8774a"/></marker></defs><rect width="210" height="297" fill="#fff"/>`;

const SVG_FOOT = `<text x="10" y="292" font-size="2.5" fill="#777">ArmaLab v${VERSION} · negro = cortar · gris = calar · azul punteado = marcar y plegar · flecha marrón = veta/fibra</text></svg>`;
function svgPage(pg, i, n){
  const m = MAT[pg.mat]; const pr = state.project;

function svgTile(t, i, n){
  const c = t.c; const m = MAT[c.mat]; const ov = 1;

function svgImgTile(fig, r, q, rows, cols, i, n){

function allPagesSVG(incluirGrandes){

  state.sel = id; if (id && fromView && state.tabL!=='modelar'){ state.tabL = 'modelar'; showTabs(); }
  highlight(); renderModelar();
  if (id){ const b = document.querySelector(`[data-sel="${id}"]`); if (b && fromView) b.scrollIntoView({block:'nearest'}); }
}
function afterEdit(rebuildLeft){
  state.project.modificado = !!state.project.template; save(); rebuildScene(); renderRight(); renderStats();
  if (rebuildLeft){ renderModelar(); renderProyecto(); } else renderEditorValues();
}
function addPiece(kind){
  const m = MAT[state.matSel]; const K = KINDS[kind]; const p = {}; K.params.forEach(q=>p[q.k]=q.def);
  if (kind==='arbol'){ p.c1 = 'rosa claro'; p.c2 = 'rosa fuerte'; }
  if (kind==='esfera'){ p.pasta='engrudo'; p.term='nada'; p.tcolor='blanco'; p.hum=1; }
  const bb = sceneBox(); const top = bb.isEmpty() ? 0 : bb.max.y; const t = Math.max((m.esp||0)/10, 0.03);
  let pos = [0, r1(top), 0];
  if (kind==='placa' || kind==='disco') pos = [0, r1(top + t/2), 0]; else if (kind==='racimo') pos = [0, r1(top + p.r), 0]; else if (kind==='esfera') pos = [0, r1(top + p.alto/2), 0];
  const pc = P(kind, m.id, p, pos, m.colorable ? {color: ['crepe','seda'].includes(m.id) ? 'rosa claro' : 'verde'} : {});
  pc.id = newId(); state.project.pieces.push(pc); state.sel = pc.id;
  afterEdit(true);
}
function regenTemplate(params){
  const pr = state.project; const nombre = pr.nombre;
  fromTemplate(pr.template.id, params); state.project.nombre = nombre; state.sel = null;
  save(); rebuildScene(); renderRight(); renderStats(); renderModelar();
  const w = document.querySelector('#L-proyecto .note.warn'); if (w) w.remove();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('button, [data-goto]'); if (!t) return;
  if (t.closest('.tabs')){ const g = t.closest('.tabs').dataset.group; if (g==='L') state.tabL = t.dataset.tab; else state.tabR = t.dataset.tab; showTabs(); highlight(); return; }
  if (t.dataset.tpl !== undefined){
    if (t.dataset.tpl===''){ setProject({nombre:'Mi proyecto', template:null, pieces:[], next:1, modificado:false, v:VERSION}); state.tabL='modelar'; showTabs(); return; }
    fromTemplate(t.dataset.tpl); setProject(state.project); return;
  }
  if (t.dataset.mat){ state.matSel = t.dataset.mat; renderModelar(); return; }
  if (t.dataset.add){ addPiece(t.dataset.add); return; }
  if (t.dataset.sel){ select(t.dataset.sel); return; }
  if (t.dataset.goto){ state.tabL='modelar'; showTabs(); select(t.dataset.goto); return; }
  const pc = getPiece(state.sel);
  switch (t.id){
    case 'verBtn': showChangelog(); break;
    case 'closeModal': $('#modal').hidden = true; break;
    case 'e-del': if (pc){ state.project.pieces = state.project.pieces.filter(p=>p!==pc); state.sel = null; afterEdit(true); } break;
    case 'e-dup': if (pc){ const c = JSON.parse(JSON.stringify(pc)); c.id = newId(); c.pos = [r1(c.pos[0]+2), c.pos[1], r1(c.pos[2]+2)]; state.project.pieces.push(c); state.sel = c.id; afterEdit(true); } break;
    case 'e-floor': if (pc){ const o = objs.get(pc.id); const bb = new THREE.Box3().setFromObject(o); pc.pos[1] = r1(pc.pos[1] - bb.min.y); afterEdit(false); } break;
    case 'e-stand': if (pc){ pc.rot = (pc.rot[0]===90 || pc.rot[2]===90) ? [0,pc.rot[1],0] : [90,pc.rot[1],0]; const o = buildPiece(pc); const bb = new THREE.Box3().setFromObject(o); pc.pos[1] = r1(pc.pos[1] - bb.min.y); afterEdit(false); } break;
    case 'tMove': state.tmode='translate'; $('#tMove').setAttribute('aria-pressed',true); $('#tRot').setAttribute('aria-pressed',false); tctl.setMode('translate'); break;
    case 'tRot': state.tmode='rotate'; $('#tRot').setAttribute('aria-pressed',true); $('#tMove').setAttribute('aria-pressed',false); tctl.setMode('rotate'); break;
    case 'tFit': fit(); break;
    case 'tFront': fit(new THREE.Vector3(0,0.12,1)); break;
    case 'tTop': fit(new THREE.Vector3(0,1,0.02)); break;
    case 'tRuler': state.ruler = !state.ruler; t.setAttribute('aria-pressed', state.ruler); drawRuler(); break;
    case 'tHuman': state.human = !state.human; t.setAttribute('aria-pressed', state.human); drawHuman(); if (state.human){ const bb = sceneBox(); bb.expandByObject(humanG); const c = bb.getCenter(new THREE.Vector3()); orbit.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(0.7,0.5,0.85).normalize().multiplyScalar(Math.max(bb.max.y,60)*2.2)); } break;
    case 'resetPrecios': precios = {}; LS.set('armalab.precios', precios); renderMateriales(); renderRight(); renderStats(); renderModelar(); break;
    case 'printBtn': { $('#print').innerHTML = allPagesSVG(true).map(s=>`<div class="pp">${s}</div>`).join(''); try{ window.print(); }catch(err){} break; }
    case 'copyList': {
      const {lines, N} = computeBOM(); const txt = `Lista para "${state.project.nombre}"${N>1?` (${N} unidades)`:''} · ArmaLab\n` + lines.filter(l=>!state.tengo.has(l.id) && !l.opcional).map(l=>`- ${l.n} ${l.unidadBase} · ${l.nombre}${l.cat==='material'?` (${l.best.o.t})`:''}`).join('\n');
      const done = ok => { $('#copyMsg').textContent = ok ? 'Copiada.' : 'Seleccioná el texto y copialo.'; };
      const fb = () => { const ta = $('#copyTxt'); ta.hidden = false; ta.value = txt; ta.select(); done(false); };
      try{ navigator.clipboard.writeText(txt).then(()=>done(true), fb); }catch(err){ fb(); } break; }
    case 'exp': {
      const txt = JSON.stringify(state.project); const ta = $('#impTxt');
      try{ navigator.clipboard.writeText(txt).then(()=>{$('#impMsg').textContent='Código copiado.';}, ()=>{ ta.value = txt; ta.select(); $('#impMsg').textContent='Copiá el texto de arriba.'; }); }catch(err){ ta.value = txt; ta.select(); } break; }
    case 'imp': {
      try{ const pr = JSON.parse($('#impTxt').value); if (!pr || !Array.isArray(pr.pieces)) throw 0; pr.pieces = pr.pieces.filter(p=>KINDS[p.kind] && MAT[p.mat]); setProject(pr); }
      catch(err){ $('#impMsg').textContent = 'Ese código no es un proyecto válido.'; } break; }
  }
});
$('#modal').addEventListener('click', e=>{ if (e.target.id==='modal') $('#modal').hidden = true; });
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.dataset.img && t.files && t.files[0]){
    const fr = new FileReader(); fr.onload = () => { state.img = fr.result; imgTex = null; try{ if (state.imgURL) URL.revokeObjectURL(state.imgURL); state.imgURL = URL.createObjectURL(t.files[0]); }catch(err){}
      if (!LS.set('armalab.img', state.img)) LS.set('armalab.img', null); rebuildScene(); renderRight(); renderProyecto(); }; fr.readAsDataURL(t.files[0]);
  }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.id && t.id.startsWith('k-')){ calcTec(); return; }
  if (t.closest('#tplForm') && t.dataset.k){
    const pr = state.project; const T = TEMPLATES[pr.template.id]; const q = T.params.find(x=>x.k===t.dataset.k); if (!q) return;
    let v = q.type==='num' ? parseFloat(t.value) : t.value; if (q.type==='num'){ if (isNaN(v)) return; v = clamp(v, q.min, q.max); }
    if (q.type==='sel' && typeof q.def==='number') v = parseFloat(v);
    regenTemplate(Object.assign({}, pr.template.params, {[q.k]:v}));
    return;
  }
  if (t.id==='pname'){ state.project.nombre = t.value || 'Mi proyecto'; save(); renderStats(); return; }
  if (t.id==='cN'){ const v = parseInt(t.value,10); if (!isNaN(v) && v>=1){ state.N = Math.min(500, v); LS.set('armalab.N', state.N); const pos = t.selectionStart; renderCompras(); const n = $('#cN'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} } return; }
  if (t.id==='cTr'){ state.transfer = t.checked; LS.set('armalab.transfer', state.transfer); renderCompras(); renderStats(); renderPiezas(); return; }
  if (t.dataset.precio){ const v = parseFloat(t.value); if (!isNaN(v)){ precios[t.dataset.precio] = v; LS.set('armalab.precios', precios); renderRight(); renderStats(); } return; }
  if (t.dataset.tengo){ t.checked ? state.tengo.add(t.dataset.tengo) : state.tengo.delete(t.dataset.tengo); LS.set('armalab.tengo', [...state.tengo]); renderCompras(); renderPiezas(); renderStats(); return; }
  const pc = getPiece(state.sel); if (!pc || !t.closest('#editor')) return;
  if (t.id==='e-mat'){ pc.mat = t.value; if (MAT[pc.mat].colorable && !pc.color) pc.color = 'rosa claro'; afterEdit(true); return; }
  if (t.id==='e-color'){ pc.color = t.value; afterEdit(true); return; }
  if (t.dataset.pc){ pc.p[t.dataset.pc] = t.value; afterEdit(false); return; }
  if (t.dataset.ps){ pc.p[t.dataset.ps] = t.value; afterEdit(true); return; }
  const v = parseFloat(t.value); if (isNaN(v)) return;
  if (t.dataset.p){ const q = KINDS[pc.kind].params.find(x=>x.k===t.dataset.p); pc.p[t.dataset.p] = clamp(v, q.min, q.max); afterEdit(false); return; }
  if (t.dataset.pos){ pc.pos[+t.dataset.pos] = v; afterEdit(false); return; }
  if (t.dataset.rot){ pc.rot[+t.dataset.rot] = v; afterEdit(false); return; }
});
window.addEventListener('keydown', e=>{
  if (e.key==='Escape' && !$('#modal').hidden){ $('#modal').hidden = true; return; }
  if (e.target.closest('input,textarea,select')) return;
  if ((e.key==='Delete' || e.key==='Backspace') && state.sel && $('#e-del')) $('#e-del').click();
  if (e.key==='Escape') select(null);
});

/* ---------- Inicio ---------- */
(function init(){
  $('#verTxt').textContent = VERSION;
  state.img = LS.get('armalab.img', null);
  const saved = LS.get('armalab.proyecto', null);
  if (saved && Array.isArray(saved.pieces) && saved.pieces.every(p=>KINDS[p.kind] && MAT[p.mat])) state.project = saved;
  else fromTemplate('sakura');
  resize(); rebuildScene(); renderAll(); fit();
  if (LS.get('armalab.vista', null) !== VERSION){ LS.set('armalab.vista', VERSION); if (saved) showChangelog(); }
})();
</script>
